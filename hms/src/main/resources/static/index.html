<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HMS Hospital — Sistema de Gestão Hospitalar</title>
	<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
	<a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

	<!-- AUTH VIEW (Login & Cadastro - T09 / T10) -->
	<div id="auth-screen" class="auth-wrapper">
		<div class="auth-card" role="region" aria-label="Autenticação no sistema HMS">
			<div class="auth-brand">
				<div class="brand-badge" aria-hidden="true">HMS</div>
				<div>
					<h1>HMS Hospital</h1>
					<p>Sistema de Gestão Hospitalar</p>
				</div>
			</div>

			<div class="auth-tabs" role="tablist" aria-label="Modo de autenticação">
				<button type="button" id="tab-login" class="auth-tab active" role="tab" aria-selected="true">Entrar</button>
				<button type="button" id="tab-register" class="auth-tab" role="tab" aria-selected="false">Criar Conta</button>
			</div>

			<div id="auth-alert" class="alert hidden" role="alert" aria-live="polite"></div>

			<form id="login-form" class="auth-form">
				<div class="form-group">
					<label for="login-email">E-mail</label>
					<input id="login-email" type="email" required placeholder="admin@hms.com" autocomplete="username">
				</div>
				<div class="form-group">
					<label for="login-password">Senha</label>
					<input id="login-password" type="password" required placeholder="Sua senha" autocomplete="current-password">
				</div>
				<button type="submit" class="btn btn-primary btn-full">Entrar no Sistema</button>

				<div class="demo-box">
					<p><strong>Acesso Rápido (Demo Local):</strong></p>
					<div class="demo-actions">
						<button type="button" id="fill-admin-btn" class="btn btn-secondary btn-sm">Admin (admin@hms.com)</button>
						<button type="button" id="fill-patient-btn" class="btn btn-secondary btn-sm">Paciente (paciente@hms.com)</button>
					</div>
				</div>
			</form>

			<form id="register-form" class="auth-form hidden">
				<div class="form-group">
					<label for="reg-name">Nome Completo</label>
					<input id="reg-name" type="text" required placeholder="Ex: Maria Oliveira">
				</div>
				<div class="form-group">
					<label for="reg-email">E-mail</label>
					<input id="reg-email" type="email" required placeholder="maria@hms.com" autocomplete="email">
				</div>
				<div class="form-group">
					<label for="reg-password">Senha (mín. 6 caracteres)</label>
					<input id="reg-password" type="password" required minlength="6" placeholder="Crie uma senha" autocomplete="new-password">
				</div>
				<p class="text-muted" style="font-size:0.85rem;margin-bottom:0.75rem">Novas contas públicas são criadas com o perfil <strong>Paciente</strong>.</p>
				<button type="submit" class="btn btn-primary btn-full">Cadastrar e Entrar</button>
			</form>

			<div class="auth-footer">
				<button type="button" id="auth-contrast-toggle" class="btn btn-outline btn-sm">Alto Contraste (WCAG)</button>
			</div>
		</div>
	</div>

	<!-- MAIN APP SHELL (Matching Figma Design) -->
	<div id="app-shell" class="app-layout hidden">
		<aside class="sidebar" aria-label="Menu principal de navegação">
			<div class="sidebar-header">
				<span class="sidebar-title">HMS Hospital</span>
			</div>

			<nav class="sidebar-nav" aria-label="Módulos do sistema">
				<button type="button" class="nav-item active" data-view="hospital">Hospital</button>
				<button type="button" class="nav-item" data-view="doctors">Médicos</button>
				<button type="button" class="nav-item" data-view="patients">Pacientes</button>
				<button type="button" class="nav-item" data-view="invoices">Faturas</button>
				<button type="button" class="nav-item" data-view="bills">Contas</button>
				<button type="button" class="nav-item" data-view="dashboard">Dashboard</button>
				<button type="button" class="nav-item" data-view="appointments">Agendamentos &amp; Vagas</button>
				<button type="button" class="nav-item" data-view="history">Histórico &amp; NF-e</button>
				<button type="button" class="nav-item" data-view="doctor-profit">Lucro por Médico</button>
				<button type="button" class="nav-item" data-view="accessibility">Acessibilidade</button>
			</nav>

			<div class="sidebar-footer">
				<div id="session-info" class="session-box">
					<div class="session-user" id="user-display-name">Usuário</div>
					<div class="session-meta" id="user-display-role">ADMIN</div>
					<div class="session-actions">
						<button type="button" id="logout-btn" class="btn-sidebar btn-sidebar-danger">Sair</button>
					</div>
				</div>
				<button type="button" id="sidebar-mode-badge" class="mode-badge" aria-label="Alternar modo de alto contraste">
					Modo de Exibição: Padrão
				</button>
			</div>
		</aside>

		<div class="content-area">
			<header class="topbar">
				<h1 id="page-title" class="page-title">Informações da Instituição Hospitalar</h1>
				<div id="topbar-actions" class="topbar-actions"></div>
			</header>

			<main id="main-content" class="main-content" tabindex="-1">
				<div id="global-toast" class="toast hidden" role="status" aria-live="polite"></div>
				<div id="view-container"></div>
			</main>
		</div>
	</div>

	<!-- MODAL CONTAINER -->
	<div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
		<div class="modal-card">
			<div class="modal-header">
				<h2 id="modal-title">Detalhes</h2>
				<button type="button" id="modal-close-btn" class="btn-icon" aria-label="Fechar modal">&times;</button>
			</div>
			<div id="modal-body" class="modal-body"></div>
		</div>
	</div>

	<script type="module" src="/js/main.js"></script>
</body>
</html>
